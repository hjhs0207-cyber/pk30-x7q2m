<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>포켓몬카드 재고</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e4e2dc; --ok:#1f8a4c; --okbg:#e6f4ec; --no:#9a9aa0; --warn:#b5620b; --accent:#2b59c3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 16px 8px; max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; }
  main { max-width:760px; margin:0 auto; padding:0 16px 40px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .controls input { flex:1 1 120px; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  button { padding:10px 14px; border:0; border-radius:10px; font-size:15px; cursor:pointer; background:var(--ink); color:#fff; }
  button.light { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  #map { height:320px; border-radius:14px; border:1px solid var(--line); }
  .hint { font-size:12px; color:var(--sub); margin:6px 2px 0; }
  #status { margin:16px 2px 8px; font-size:14px; color:var(--sub); }
  .chains { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { font-size:12px; padding:4px 8px; border-radius:999px; background:#fff; border:1px solid var(--line); color:var(--sub); }
  .chip.err { color:var(--warn); border-color:#f0d3b4; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .row.out { opacity:.55; }
  .brand { font-size:12px; font-weight:600; padding:3px 7px; border-radius:6px; color:#fff; white-space:nowrap; }
  .b-gs25 { background:#0a7ac1; } .b-cu { background:#6f2c91; } .b-seveneleven { background:#e8501b; } .b-emart24 { background:#e0a100; }
  .name { flex:1; font-size:15px; }
  .dist { font-size:12px; color:var(--sub); }
  .qty { font-weight:700; font-size:15px; white-space:nowrap; }
  .qty.ok { color:var(--ok); background:var(--okbg); padding:6px 10px; border-radius:8px; font-size:16px; text-align:center; }
  .qty small { display:block; font-size:10px; font-weight:500; opacity:.8; }
  .qty.no { color:var(--no); }
  details { margin-top:14px; }
  summary { cursor:pointer; color:var(--sub); font-size:14px; }
  .packs { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin:12px 0; }
  .packs-head { display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:600; margin-bottom:8px; }
  .packs-head button { padding:4px 10px; font-size:12px; }
  .pack-list { display:flex; flex-wrap:wrap; gap:6px; }
  .pack-list label { display:flex; align-items:center; gap:4px; font-size:13px; padding:6px 10px; border:1px solid var(--line); border-radius:999px; cursor:pointer; user-select:none; }
  .pack-list label.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .pack-list input { display:none; }
  .store { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .store.out { opacity:.55; }
  .store-top { display:flex; align-items:center; gap:10px; }
  .items { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .item { display:flex; justify-content:space-between; align-items:center; font-size:14px; padding-left:4px; }
  .item .qty.ok { font-size:15px; padding:4px 10px; }
  footer { max-width:760px; margin:0 auto; padding:0 16px 30px; font-size:12px; color:var(--sub); line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>포켓몬카드 편의점 재고</h1>
  <div class="sub">선택한 위치 반경 1km · GS25 · CU · 세븐일레븐 · 이마트24</div>
</header>
<main>
  <div class="controls">
    <button id="gps">📍 현재 위치</button>
    <input id="q" placeholder="역·동네 이름 검색 (예: 옥수역)" autocomplete="off">
    <button id="search" class="light">검색</button>
  </div>
  <div class="packs">
    <div class="packs-head"><span>조회할 확장팩</span><button id="allPacks" class="light">전체 선택</button></div>
    <div class="pack-list" id="packList"><span class="sub">확장팩 목록을 불러오는 중…</span></div>
  </div>
  <div id="map"></div>
  <div class="hint">지도를 눌러서 원하는 위치를 직접 고를 수도 있어요. 확장팩을 많이 고를수록 조회가 오래 걸려요.</div>

  <div id="status">위치를 고르면 재고를 조회해요.</div>
  <div class="chains" id="chains"></div>
  <div class="list" id="instock"></div>
  <details id="outWrap" hidden>
    <summary id="outSum"></summary>
    <div class="list" id="outstock" style="margin-top:8px"></div>
  </details>
</main>
<footer>
  재고 정보는 비공식 공개 API(daiso-mcp)를 거쳐 가져와서 실제와 다를 수 있어요. 방문 전에 매장에 전화로 확인하면 헛걸음을 줄일 수 있어요.<br>
  지도 © OpenStreetMap 기여자
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "https://mcp.aka.page";
const RADIUS = 1000;
const LABEL = { gs25: "GS25", cu: "CU", seveneleven: "세븐일레븐", emart24: "이마트24" };
const TARGET = {
  gs25: "포켓몬카드)30주년메가확장팩",
  cu: "포켓몬)30주년기념카드",
  seveneleven: "비젼)포켓몬확장팩(30주년)_H",
  emart24: "포켓몬)포켓몬카드(30주년셀레브레이션)",
};
const $ = (id) => document.getElementById(id);

// ── 지도 ──
const map = L.map("map").setView([37.5665, 126.978], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
let centerMarker = null, circle = null, storeLayer = L.layerGroup().addTo(map);

// ── 도구 ──
async function api(path, params) {
  const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== "" && v != null));
  const res = await fetch(`${API}${path}?${qs}`, { headers: { Accept: "application/json" } });
  let body;
  try { body = await res.json(); } catch { throw new Error(`HTTP ${res.status}`); }
  if (!res.ok || !body.success) {
    const code = body?.error?.code || `HTTP ${res.status}`;
    throw new Error(code.includes("RATE_LIMIT") || res.status === 429 ? "오늘 조회 한도 초과" : code);
  }
  return body.data || {};
}
const norm = (t) => (t || "").replace(/[^0-9a-zA-Z가-힣]/g, "").toLowerCase();
const matches = (n, t) => { n = norm(n); t = norm(t); return !!n && (n === t || n.includes(t) || t.includes(n)); };
const num = (v) => (v == null || v === "" || isNaN(Number(v)) ? null : Math.trunc(Number(v)));
function dist(lat1, lng1, lat2, lng2) {
  const r = 6371000, rad = Math.PI / 180;
  const a = Math.sin(((lat2 - lat1) * rad) / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(((lng2 - lng1) * rad) / 2) ** 2;
  return 2 * r * Math.asin(Math.sqrt(a));
}
function storeDist(s, c, centerQuery = true) {
  const lat = parseFloat(s.latitude ?? s.lat), lng = parseFloat(s.longitude ?? s.lng);
  if (lat > 33 && lat < 39 && lng > 124 && lng < 132) return { d: dist(c.lat, c.lng, lat, lng), lat, lng };
  if (centerQuery && s.distanceM != null) return { d: Number(s.distanceM), lat: null, lng: null };
  return null;
}

// ── 확장팩 목록: 30주년(products.json) + 다른 확장팩(packs.json, 알림 봇이 12시간마다 갱신) ──
let packsPromise = null;
function getPacks() {
  if (!packsPromise) packsPromise = (async () => {
    let cached = {}, extra = {};
    try { cached = await (await fetch("products.json", { cache: "no-store" })).json(); } catch {}
    try { extra = await (await fetch("packs.json", { cache: "no-store" })).json(); } catch {}
    const main = {};
    await Promise.all(Object.keys(TARGET).map(async (chain) => {
      if (cached[chain]?.id && cached[chain].target === TARGET[chain]) { main[chain] = cached[chain]; return; }
      try { main[chain] = await findProduct(chain, TARGET[chain]); } catch { main[chain] = null; }
    }));
    const list = [{ key: "30주년", products: main }];
    for (const name of extra.packs || []) list.push({ key: name, products: (extra.items || {})[name] || {} });
    return list;
  })();
  return packsPromise;
}
async function searchItems(chain, kw) {
  if (chain === "gs25") return (await api("/api/gs25/products", { keyword: kw, limit: 50 })).products?.map((p) => [p.itemCode, p.itemName || p.shortItemName]) || [];
  if (chain === "cu") return (await api("/api/cu/inventory", { keyword: kw, size: 50, storeCheck: "false" })).inventory?.items?.map((p) => [p.itemCode, p.itemName]) || [];
  if (chain === "seveneleven") return (await api("/api/seveneleven/products", { query: kw, size: 50 })).products?.map((p) => [p.itemCode, p.itemName]) || [];
  return (await api("/api/emart24/products", { keyword: kw, pageSize: 50 })).products?.map((p) => [p.pluCd, p.goodsName]) || [];
}
async function findProduct(chain, target) {
  let lastErr = null;
  for (const kw of [target, "포켓몬카드 30주년", "포켓몬 30주년", "포켓몬카드", "포켓몬"]) {
    let items;
    try { items = (await searchItems(chain, kw)).filter(([c, n]) => c && n); } catch (e) { lastErr = e; continue; }
    const hit = items.find(([, n]) => matches(n, target)) || items.find(([, n]) => n.includes("30주년") && n.includes("포켓몬"));
    if (hit) return { id: String(hit[0]), name: hit[1] };
  }
  if (lastErr) throw lastErr;
  return null;
}

// ── 세븐일레븐·이마트24는 좌표만으로 주변 매장을 못 찾아서 동네 이름이 필요해요 ──
// 지도에서 나온 동네 이름 여러 개 + 직접 검색한 이름까지 써서 빠지는 매장이 없게 해요
const stripHood = (t) => (t || "").replace(/[0-9·.\s]+/g, "").replace(/(역|동|가|리|읍|면)$/, "");
const hoodCache = new Map();
function neighborhoods(c) {
  const k = `${c.lat},${c.lng}`;
  if (!hoodCache.has(k)) hoodCache.set(k, fetchHoods(c).catch((e) => { hoodCache.delete(k); throw e; }));
  return hoodCache.get(k);
}
async function fetchHoods(c) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${c.lat}&lon=${c.lng}&zoom=17&accept-language=ko`;
  const a = (await (await fetch(url)).json()).address || {};
  const names = [c.typed, a.quarter, a.neighbourhood, a.suburb].map(stripHood).filter((n) => n && n.length >= 2 && !/구$|시$/.test(n));
  return [...new Set(names)].slice(0, 3);
}

// ── 편의점별 재고 조회 ──
async function stock(chain, p, c) {
  const rows = [];
  const push = (s, code, qty, dd) => rows.push({ chain, code: String(code), name: s.storeName || "", qty: num(qty), d: dd.d, lat: dd.lat, lng: dd.lng, phone: s.phone || s.tel || "" });
  if (chain === "seveneleven") {
    const kws = await neighborhoods(c);
    if (!kws.length) throw new Error("동네 이름 확인 실패");
    const seen = new Set(); let ok = 0, lastErr = null;
    for (const kw of kws) {
      let d;
      try {
        for (let i = 0; ; i++) { // 중계 서버가 502를 자주 내서 최대 3번까지 다시 시도해요
          try { d = await api("/api/seveneleven/inventory", { keyword: p.name, storeKeyword: kw, storeLimit: 100 }); break; }
          catch (e) { if (i >= 2 || !/HTTP 5/.test(e.message)) throw e; await new Promise((r) => setTimeout(r, 2500 * (i + 1))); }
        }
        if (p.fallback && !p.id) { // 확장팩 이름으로 찾은 경우: 돌아온 상품이 그 확장팩인지 확인
          const got = d.product?.itemName || "";
          if (!got || !norm(got).includes(norm(p.name)) || /슬리브|바인더|파일|케이스|띠부|스티커/.test(got)) throw new Error("상품 없음");
        }
        if (d.stockAvailable === false) {
          const msg = d.stockError?.message || d.note || "";
          if (/확인하지 못했습니다/.test(msg)) { ok++; continue; } // 앱에서 '재고부족'으로 나오는 경우 → 재고 없음
          throw new Error("재고 확인 실패");
        }
      } catch (e) { lastErr = e; continue; }
      ok++;
      for (const s of d.inventory?.stores || []) {
        const dd = storeDist(s, c, false);
        if (dd && dd.d <= RADIUS && s.storeCode && !seen.has(s.storeCode)) { seen.add(s.storeCode); push(s, s.storeCode, s.stockQuantity, dd); }
      }
    }
    if (!ok && lastErr) throw lastErr;
    return rows;
  }
  let stores = [], codeKey, qtyKey;
  if (chain === "gs25") { const d = await api("/api/gs25/inventory", { itemCode: p.id, lat: c.lat, lng: c.lng, storeLimit: 60 }); stores = d.inventory?.stores || []; codeKey = "storeCode"; qtyKey = "realStockQuantity"; }
  if (chain === "cu") {
    const d = await api("/api/cu/inventory", { keyword: p.name, lat: c.lat, lng: c.lng, storeLimit: 60, size: 20 });
    const ns = d.nearbyStores || {};
    if (ns.stockItemCode && String(ns.stockItemCode) !== p.id) throw new Error("상품 불일치");
    stores = ns.stores || []; codeKey = "storeCode"; qtyKey = "stock";
  }
  if (chain === "emart24") { // 좌표만으로는 주변 매장을 못 찾아서 동네 이름도 같이 보내요
    const kws = await neighborhoods(c);
    if (!kws.length) throw new Error("동네 이름 확인 실패");
    const seen = new Set(); let ok = 0, lastErr = null;
    for (const kw of kws) {
      try {
        const d = await api("/api/emart24/inventory", { pluCd: p.id, storeKeyword: kw, lat: c.lat, lng: c.lng, storeLimit: 60 });
        ok++;
        for (const st of d.inventory?.stores || d.stores || []) if (!seen.has(st.bizNo)) { seen.add(st.bizNo); stores.push(st); }
      } catch (e) { lastErr = e; }
    }
    if (!ok && lastErr) throw lastErr;
    codeKey = "bizNo"; qtyKey = "bizQty";
  }
  for (const s of stores) { const dd = storeDist(s, c); if (dd && dd.d <= RADIUS && s[codeKey]) push(s, s[codeKey], s[qtyKey], dd); }
  return rows;
}

// ── 화면 ──
// 이마트24는 실제 수량 대신 9999를 보내와서 "있음"으로만 보여줘요
function qtyLabel(q) {
  if (q == null) return "확인 불가";
  if (q >= 999) return "재고 있음<small>수량 비공개</small>";
  return q > 0 ? `재고 ${q}개` : "없음";
}
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 확장팩 체크 (이 기기에 기억해 둬요)
let selected = new Set(["30주년"]);
try { const saved = JSON.parse(localStorage.getItem("packs") || "null"); if (Array.isArray(saved) && saved.length) selected = new Set(saved); } catch {}
const saveSel = () => { try { localStorage.setItem("packs", JSON.stringify([...selected])); } catch {} };
async function renderPacks() {
  const packs = await getPacks();
  $("packList").innerHTML = packs.map((p) => `<label class="${selected.has(p.key) ? "on" : ""}"><input type="checkbox" value="${esc(p.key)}" ${selected.has(p.key) ? "checked" : ""}>${esc(p.key)}</label>`).join("");
  $("allPacks").textContent = packs.every((p) => selected.has(p.key)) ? "전체 해제" : "전체 선택";
}
$("packList").addEventListener("change", (e) => {
  const v = e.target.value; e.target.checked ? selected.add(v) : selected.delete(v);
  saveSel(); renderPacks(); scheduleRerun();
});
$("allPacks").onclick = async () => {
  const packs = await getPacks();
  if (packs.every((p) => selected.has(p.key))) selected = new Set(["30주년"]); else selected = new Set(packs.map((p) => p.key));
  saveSel(); renderPacks(); scheduleRerun();
};
let lastCenter = null, rerunTimer = null;
function scheduleRerun() { if (!lastCenter) return; clearTimeout(rerunTimer); rerunTimer = setTimeout(() => lookup(lastCenter.c, lastCenter.label), 900); }

// 동시에 너무 많이 요청하지 않도록 4개씩 나눠서 조회해요
async function pool(tasks, size, onDone) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(size, tasks.length) }, async () => {
    while (i < tasks.length) { const t = tasks[i++]; await t(); onDone(); }
  }));
}

let runId = 0;
async function lookup(c, label) {
  const my = ++runId;
  lastCenter = { c, label };
  if (centerMarker) map.removeLayer(centerMarker);
  if (circle) map.removeLayer(circle);
  centerMarker = L.marker([c.lat, c.lng]).addTo(map);
  circle = L.circle([c.lat, c.lng], { radius: RADIUS, color: "#2b59c3", weight: 1.5, fillOpacity: 0.06 }).addTo(map);
  map.fitBounds(circle.getBounds(), { padding: [10, 10] });
  storeLayer.clearLayers();
  $("chains").innerHTML = ""; $("instock").innerHTML = ""; $("outstock").innerHTML = ""; $("outWrap").hidden = true;

  const packs = (await getPacks()).filter((p) => selected.has(p.key));
  if (!packs.length) { $("status").textContent = "조회할 확장팩을 하나 이상 골라 주세요."; return; }
  const jobs = [], fails = {}, missing = {};
  for (const pack of packs) for (const chain of Object.keys(LABEL)) {
    const prod = pack.products[chain];
    if (!prod) { (missing[chain] ||= []).push(pack.key); continue; }
    jobs.push({ pack: pack.key, chain, prod });
  }
  const stores = new Map(); // chain|code → {chain, name, d, lat, lng, phone, items: [{pack, qty}]}
  let done = 0;
  const progress = () => { if (my === runId) $("status").textContent = `${label || "선택한 위치"} 주변 재고를 조회하는 중… (${done}/${jobs.length})`; };
  progress();
  await pool(jobs.map((j) => async () => {
    try {
      const rows = await stock(j.chain, j.prod, c);
      for (const r of rows) {
        const k = `${r.chain}|${r.code}`;
        if (!stores.has(k)) stores.set(k, { ...r, items: [] });
        stores.get(k).items.push({ pack: j.pack, qty: r.qty });
      }
    } catch (e) { (fails[j.chain] ||= []).push(`${j.pack}: ${e.message}`); }
  }), 4, () => { done++; progress(); });
  if (my !== runId) return; // 그 사이 다른 위치나 확장팩을 골랐으면 무시

  const all = [...stores.values()];
  for (const s of all) s.items.sort((a, b) => (b.qty || 0) - (a.qty || 0));
  const has = all.filter((s) => s.items.some((i) => (i.qty || 0) > 0)).sort((a, b) => a.d - b.d);
  const none = all.filter((s) => !s.items.some((i) => (i.qty || 0) > 0)).sort((a, b) => a.d - b.d);
  const stamp = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  $("status").innerHTML = has.length ? `<b>${has.length}곳</b>에 재고가 있어요 · ${stamp} 기준` : `1km 안에 재고 있는 매장이 없어요 · ${stamp} 기준`;

  const chips = [];
  for (const chain of Object.keys(LABEL)) {
    const f = fails[chain] || [], m = missing[chain] || [];
    if (f.length) chips.push(`<span class="chip err" title="${esc(f.join("\n"))}">${LABEL[chain]} ${f.length}개 조회 실패 · ${esc(f[0].split(": ").slice(1).join(": "))}</span>`);
    if (m.length) chips.push(`<span class="chip" title="${esc(m.join(", "))}">${LABEL[chain]} ${m.length}개 팩은 상품 없음</span>`);
    if (!f.length && !m.length) chips.push(`<span class="chip">${LABEL[chain]} 확인 완료</span>`);
  }
  $("chains").innerHTML = chips.join("");

  const html = (s, out) => `<div class="store ${out ? "out" : ""}">
      <div class="store-top"><span class="brand b-${s.chain}">${LABEL[s.chain]}</span>
        <div class="name">${esc(s.name)}<div class="dist">${Math.round(s.d)}m${s.phone ? ` · <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a>` : ""}</div></div></div>
      <div class="items">${s.items.filter((i) => out || (i.qty || 0) > 0).map((i) =>
        `<div class="item"><span>${esc(i.pack)}</span><span class="qty ${(i.qty || 0) > 0 ? "ok" : "no"}">${qtyLabel(i.qty)}</span></div>`).join("")}</div></div>`;
  $("instock").innerHTML = has.map((s) => html(s, false)).join("");
  if (none.length) { $("outWrap").hidden = false; $("outSum").textContent = `재고 없는 매장 ${none.length}곳 보기`; $("outstock").innerHTML = none.map((s) => html(s, true)).join(""); }
  for (const s of all) if (s.lat != null) {
    const ok = s.items.filter((i) => (i.qty || 0) > 0);
    L.circleMarker([s.lat, s.lng], { radius: ok.length ? 8 : 5, color: ok.length ? "#1f8a4c" : "#9a9aa0", fillOpacity: ok.length ? 0.9 : 0.4, weight: 1 })
      .bindPopup(`${LABEL[s.chain]} ${esc(s.name)}<br>${ok.length ? ok.map((i) => `${esc(i.pack)}: <b>${i.qty >= 999 ? "있음" : i.qty + "개"}</b>`).join("<br>") : "재고 없음"}`).addTo(storeLayer);
  }
}

$("gps").onclick = () => {
  if (!navigator.geolocation) return alertStatus("이 브라우저는 위치 기능을 지원하지 않아요.");
  $("status").textContent = "현재 위치를 확인하는 중…";
  navigator.geolocation.getCurrentPosition(
    (p) => lookup({ lat: p.coords.latitude, lng: p.coords.longitude }, "현재 위치"),
    () => alertStatus("위치 권한이 필요해요. 브라우저에서 위치 접근을 허용해 주세요."),
    { enableHighAccuracy: true, timeout: 10000 });
};
function alertStatus(msg) { $("status").textContent = msg; }
async function doSearch() {
  const q = $("q").value.trim();
  if (!q) return;
  $("status").textContent = "장소를 찾는 중…";
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(q)}`;
    const r = (await (await fetch(url)).json())[0];
    if (!r) return alertStatus(`'${q}'을(를) 찾지 못했어요. 다른 이름으로 검색해 보세요.`);
    lookup({ lat: parseFloat(r.lat), lng: parseFloat(r.lon), typed: q }, q);
  } catch { alertStatus("장소 검색에 실패했어요. 잠시 후 다시 시도해 주세요."); }
}
$("search").onclick = doSearch;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
map.on("click", (e) => lookup({ lat: e.latlng.lat, lng: e.latlng.lng }, "선택한 위치"));
renderPacks(); // 확장팩 목록 미리 불러오기
</script>
</body>
</html>
